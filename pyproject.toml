[project]
name = "kaszanas-lint"
version = "0.1.0"
description = "Opinionated Python lint rules that ruff does not ship: keyword arguments at call sites of project-defined functions (with autofix)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andrzej Białecki (Kaszanas)" }]
requires-python = ">=3.10"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["lint", "keyword-arguments", "ruff", "pre-commit", "agents"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Kaszanas/kaszanas_agents"
Issues = "https://github.com/Kaszanas/kaszanas_agents/issues"

[project.scripts]
kaszanas-lint = "kaszanas_lint.command_line_interface:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaszanas_lint"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "prek>=0.5", "commitizen>=4"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Keep `# noqa: KWA001` comments from being reported as unknown/unused by ruff.
external = ["KWA", "MAT", "CMT"]

[tool.kaszanas-lint]
exclude = ["tests/fixtures/**"]
